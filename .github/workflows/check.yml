name: Crypto 45m Candle Alert

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-candle-alert
  cancel-in-progress: false

jobs:
  candle-alert:
    name: Check Crypto Candles
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run candle alert
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python check.py
