name: candle-check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candle-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python3 check.py
